<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamRoom — Watch</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #7c6af7;
    --accent2: #f76a8a;
    --green: #4af7a0;
    --text: #e8e6ff;
    --muted: #6b6890;
    --font-mono: 'Space Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .logo span { color: var(--accent2); }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 13px;
    font-family: var(--font-mono);
    color: var(--muted);
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0; transition: background 0.3s;
  }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  main {
    display: grid;
    grid-template-columns: 1fr 340px;
    flex: 1;
    overflow: hidden;
  }

  .video-section {
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 16px;
    overflow-y: auto;
  }

  .video-wrapper {
    position: relative;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    aspect-ratio: 16/9;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    position: absolute;
    inset: 0;
  }

  .placeholder .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .placeholder p { color: var(--muted); font-size: 14px; font-family: var(--font-mono); text-align: center; }

  .host-info {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .host-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; flex-shrink: 0;
    color: white;
  }

  .host-name { font-weight: 600; font-size: 16px; }
  .host-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .vol-control {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
  }

  .vol-control label { color: var(--muted); font-size: 13px; }
  .vol-control input[type=range] { width: 100px; accent-color: var(--accent); }

  /* Chat sidebar */
  .chat-sidebar {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    background: var(--surface);
  }

  .chat-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    flex-shrink: 0;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg { display: flex; flex-direction: column; gap: 2px; }
  .msg-sender { font-size: 11px; font-family: var(--font-mono); color: var(--accent2); font-weight: 700; }
  .msg-sender.host { color: var(--accent); }

  .msg-text {
    font-size: 14px; color: var(--text); line-height: 1.5;
    background: var(--surface2); border-radius: 10px 10px 10px 2px;
    padding: 8px 12px; max-width: 95%; width: fit-content; word-break: break-word;
  }

  .msg.self .msg-text {
    background: rgba(124,106,247,0.2);
    border-radius: 10px 10px 2px 10px;
    margin-left: auto;
  }
  .msg.self .msg-sender { text-align: right; color: var(--accent); }

  .msg-system .msg-text {
    background: transparent; color: var(--muted); font-size: 12px;
    font-family: var(--font-mono); padding: 4px 0; text-align: center;
    width: 100%; max-width: 100%; border-radius: 0;
  }

  .chat-input-area {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; flex-shrink: 0;
  }

  .chat-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: var(--font-body); font-size: 14px; outline: none;
    transition: border-color 0.15s; resize: none; height: 40px;
  }
  .chat-input:focus { border-color: var(--accent); }

  .send-btn {
    background: var(--accent); border: none; border-radius: 8px;
    width: 40px; height: 40px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: opacity 0.15s; color: white; font-size: 18px;
  }
  .send-btn:hover { opacity: 0.85; }

  /* Join screen */
  #join-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }

  .join-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 40px; width: 460px;
    max-width: calc(100vw - 40px); text-align: center;
  }

  .join-card .logo-big {
    font-family: var(--font-mono); font-size: 28px;
    font-weight: 700; color: var(--accent); margin-bottom: 8px;
  }
  .join-card .logo-big span { color: var(--accent2); }
  .join-card p { color: var(--muted); font-size: 15px; margin-bottom: 28px; line-height: 1.6; }

  .name-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px; color: var(--text);
    font-family: var(--font-body); font-size: 16px; outline: none;
    margin-bottom: 16px; transition: border-color 0.15s;
  }
  .name-input:focus { border-color: var(--accent); }

  .go-btn {
    width: 100%; background: var(--accent); border: none; border-radius: 10px;
    padding: 14px; color: white; font-family: var(--font-body);
    font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
  }
  .go-btn:hover { opacity: 0.85; }

  .error-msg { color: #f06060; font-size: 13px; margin-top: 12px; }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .chat-sidebar { border-left: none; border-top: 1px solid var(--border); min-height: 280px; }
    .vol-control { display: none; }
  }
</style>
</head>
<body>

<!-- Join screen -->
<div id="join-screen">
  <div class="join-card">
    <div class="logo-big">Stream<span>Room</span></div>
    <p>You've been invited to watch a live stream. Enter your name to join the chat.</p>
    <input class="name-input" id="viewerName" placeholder="Your name" maxlength="30" />
    <button class="go-btn" onclick="joinStream()">🍿 Join Stream</button>
    <p class="error-msg" id="joinError"></p>
  </div>
</div>

<header>
  <div class="logo">Stream<span>Room</span> <small style="color:var(--muted);font-size:11px;font-weight:400"> — VIEWER</small></div>
  <div class="status-pill"><div class="dot" id="liveDot"></div><span id="statusText">Connecting…</span></div>
</header>

<main>
  <div class="video-section">
    <div class="video-wrapper">
      <div class="placeholder" id="placeholder">
        <div class="spinner"></div>
        <p>Waiting for<br>the host's stream…</p>
      </div>
      <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
    </div>

    <div class="host-info" id="hostInfo">
      <div class="host-avatar" id="hostAvatar">?</div>
      <div>
        <div class="host-name" id="hostNameLabel">Connecting to host…</div>
        <div class="host-sub">Live stream</div>
      </div>
      <div class="vol-control">
        <label>Volume</label>
        <input type="range" min="0" max="1" step="0.05" value="1"
          oninput="document.getElementById('remoteVideo').volume = this.value" />
      </div>
    </div>
  </div>

  <div class="chat-sidebar">
    <div class="chat-header">💬 Live Chat</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input class="chat-input" id="chatInput" placeholder="Say something…" maxlength="300"
        onkeydown="if(event.key==='Enter')sendChat()" />
      <button class="send-btn" onclick="sendChat()">↑</button>
    </div>
  </div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const roomId = params.get('room');
  let peer, dataConn, myName = 'Viewer';

  if (!roomId) {
    document.getElementById('joinError').textContent = 'No stream ID found in URL. Check your link.';
  }

  function joinStream() {
    const nameVal = document.getElementById('viewerName').value.trim();
    if (!nameVal) { document.getElementById('joinError').textContent = 'Please enter your name.'; return; }
    if (!roomId) { document.getElementById('joinError').textContent = 'Invalid stream link — missing room ID.'; return; }
    myName = nameVal;
    document.getElementById('join-screen').style.display = 'none';
    initViewer();
  }

  function initViewer() {
    peer = new Peer({ debug: 0 });

    peer.on('open', myId => {
      document.getElementById('statusText').textContent = 'Connecting…';

      // Open data connection to host for chat
      dataConn = peer.connect(roomId, { reliable: true });

      dataConn.on('open', () => {
        dataConn.send(JSON.stringify({ type: 'hello', name: myName }));
        addSystemMsg('You joined the stream 🎉');
        document.getElementById('statusText').textContent = 'In stream';
        document.getElementById('liveDot').classList.add('live');
      });

      dataConn.on('data', raw => {
        try {
          const msg = JSON.parse(raw);
          if (msg.type === 'chat') {
            addMsg(msg.name, msg.text, false);
          } else if (msg.type === 'welcome') {
            const hName = msg.name;
            document.getElementById('hostNameLabel').textContent = hName;
            document.getElementById('hostAvatar').textContent = hName.charAt(0).toUpperCase();
          } else if (msg.type === 'system') {
            addSystemMsg(msg.text);
          }
        } catch(e) {}
      });

      dataConn.on('close', () => {
        addSystemMsg('Disconnected from host.');
        document.getElementById('liveDot').classList.remove('live');
        document.getElementById('statusText').textContent = 'Disconnected';
      });

      dataConn.on('error', err => {
        addSystemMsg('Connection error: ' + err.message);
      });
    });

    // Receive the video call from host
    peer.on('call', call => {
      call.answer(); // No need to send stream back
      call.on('stream', remoteStream => {
        const video = document.getElementById('remoteVideo');
        video.srcObject = remoteStream;
        video.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('statusText').textContent = 'Live';
        document.getElementById('liveDot').classList.add('live');
      });
      call.on('close', () => {
        document.getElementById('remoteVideo').style.display = 'none';
        document.getElementById('placeholder').style.display = 'flex';
        document.getElementById('placeholder').querySelector('p').textContent = 'Stream ended';
      });
    });

    peer.on('error', err => {
      if (err.type === 'peer-unavailable') {
        addSystemMsg('⚠ Could not reach the host. They may not be live yet.');
        document.getElementById('statusText').textContent = 'Host unavailable';
      }
    });
  }

  function sendChat() {
    if (!dataConn || !dataConn.open) return;
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    dataConn.send(JSON.stringify({ type: 'chat', name: myName, text }));
    addMsg(myName, text, true);
  }

  function addMsg(sender, text, isSelf) {
    const box = document.getElementById('chatMessages');
    const isHost = sender.includes('(host)');
    const div = document.createElement('div');
    div.className = 'msg' + (isSelf ? ' self' : '');
    div.innerHTML = `<div class="msg-sender ${isHost ? 'host' : ''}">${esc(sender)}</div>
                     <div class="msg-text">${esc(text)}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function addSystemMsg(text) {
    const box = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg msg-system';
    div.innerHTML = `<div class="msg-text">${esc(text)}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  document.getElementById('viewerName').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinStream();
  });
</script>
</body>
</html>
