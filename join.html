<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join PeerLink Call</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f14; --bg2: #161920; --bg3: #1e2230; --bg4: #252a3a;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #eef0f6; --text2: #8b90a8; --text3: #565c78;
    --accent: #4f8ef7; --accent2: #3a7aee; --green: #3ecf8e;
    --red: #f56565; --amber: #f6ad55;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 14px; }
  .container {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; gap: 16px;
  }
  .logo { font-size: 40px; margin-bottom: 4px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .subtitle { color: var(--text2); font-size: 14px; text-align: center; }
  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; width: 100%; max-width: 420px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .section-label { font-size: 11px; font-weight: 600; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.6px; }
  input {
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--text); font-size: 22px;
    padding: 14px 16px; outline: none; width: 100%;
    text-align: center; letter-spacing: 6px; font-weight: 700;
    text-transform: uppercase; transition: border-color 0.15s;
    font-family: 'Courier New', monospace;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { font-size: 14px; letter-spacing: 0; font-weight: 400;
    color: var(--text3); font-family: inherit; }
  .btn {
    border: none; border-radius: 10px; cursor: pointer;
    font-size: 15px; font-weight: 600; padding: 14px;
    transition: all 0.15s; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Video layout */
  #call-ui { display: none; flex-direction: column; width: 100%;
    max-width: 900px; gap: 12px; }
  .video-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    background: #050709; border-radius: 14px; overflow: hidden; padding: 8px;
  }
  @media (max-width: 600px) { .video-grid { grid-template-columns: 1fr; } }
  .video-wrap {
    position: relative; border-radius: 10px; overflow: hidden;
    background: #111; aspect-ratio: 16/9;
  }
  .video-label {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(0,0,0,0.6); color: #fff;
    font-size: 11px; padding: 3px 8px; border-radius: 99px;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .controls {
    display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  .ctrl-btn {
    border: none; border-radius: 50%; cursor: pointer;
    width: 48px; height: 48px; font-size: 18px;
    background: var(--bg4); color: var(--text);
    border: 1px solid var(--border2); transition: all 0.15s;
  }
  .ctrl-btn:hover { background: var(--bg3); }
  .ctrl-btn.active { background: var(--accent); border-color: var(--accent); }
  .ctrl-btn.red { background: var(--red); border-color: var(--red); color: #fff; }

  /* Chat */
  .chat-area {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
    height: 260px;
  }
  .chat-title { padding: 10px 14px; font-size: 12px; font-weight: 600;
    border-bottom: 1px solid var(--border); color: var(--text2); }
  .chat-msgs {
    flex: 1; overflow-y: auto; padding: 10px 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .msg {
    padding: 7px 10px; border-radius: 10px; font-size: 13px;
    max-width: 80%; line-height: 1.4;
  }
  .msg.mine { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.theirs { align-self: flex-start; background: var(--bg3); }
  .msg.system { align-self: center; color: var(--text3); font-size: 11px; background: transparent; }
  .chat-row {
    display: flex; gap: 6px; padding: 8px 10px;
    border-top: 1px solid var(--border);
  }
  .chat-row input {
    font-size: 13px; padding: 8px 12px; text-align: left;
    letter-spacing: 0; text-transform: none; font-weight: 400;
    font-family: inherit;
  }
  .chat-row .send-btn {
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
    font-size: 13px; white-space: nowrap;
  }
  .chat-row .send-btn:hover { background: var(--accent2); }

  /* Status */
  #status-bar {
    color: var(--text2); font-size: 13px; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); }
  .dot.green { background: var(--green); }
  .dot.amber { animation: pulse 1.5s infinite; background: var(--amber); }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

  /* Files */
  .files-area {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
  }
  .files-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .files-header span { font-size: 12px; font-weight: 600; color: var(--text2); }
  .files-list { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 50px; }
  .file-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--bg3); border-radius: 8px; font-size: 12px;
  }
  .file-icon { font-size: 18px; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 11px; color: var(--text3); }
  .progress-bar { height: 3px; background: var(--bg4); border-radius: 2px; margin-top: 4px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.1s; }
  #file-input-web { display: none; }
  .send-file-btn {
    margin: 8px 12px 12px; display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 9px; background: var(--bg4); color: var(--text2);
    border: 1px dashed var(--border2); border-radius: 8px; cursor: pointer;
    font-size: 12px; transition: all 0.15s;
  }
  .send-file-btn:hover { background: var(--bg3); color: var(--text); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg4); color: var(--text); border: 1px solid var(--border2);
    padding: 8px 18px; border-radius: 99px; font-size: 13px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container" id="join-ui">
  <div class="logo">📡</div>
  <h1>PeerLink Video Chat</h1>
  <p class="subtitle">Enter the room code to join the call.<br>Works in any browser — no download needed.</p>

  <div class="card">
    <div class="section-label">Room Code</div>
    <input type="text" id="room-code-input" maxlength="6" placeholder="e.g. ABC123" autocomplete="off" spellcheck="false">
    <div id="status-bar">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">Enter a code to join</span>
    </div>
    <button class="btn btn-primary" id="btn-join">🎥 Join Call</button>
  </div>

  <p style="color:var(--text3);font-size:12px;text-align:center">
    Your call is private and peer-to-peer.<br>No account or sign-up required.
  </p>
</div>

<!-- Active call UI -->
<div id="call-ui" style="display:none">
  <div style="text-align:center; padding: 16px 0 4px;">
    <span style="font-size:22px">📡</span>
    <span style="font-size:16px; font-weight:600; margin-left:6px">PeerLink</span>
  </div>

  <div id="web-status-bar" style="text-align:center; color:var(--text2); font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:4px;">
    <div class="dot amber" id="web-dot"></div>
    <span id="web-status-text">Connecting…</span>
  </div>

  <div class="video-grid">
    <div class="video-wrap">
      <video id="video-remote" autoplay playsinline></video>
      <div class="video-label">Them</div>
    </div>
    <div class="video-wrap">
      <video id="video-local" autoplay playsinline muted></video>
      <div class="video-label">You</div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="web-mute" title="Mute">🎤</button>
    <button class="ctrl-btn" id="web-video" title="Camera">📹</button>
    <button class="ctrl-btn" id="web-screen" title="Share screen">🖥️</button>
    <button class="ctrl-btn red" id="web-hangup" title="Hang up">📵</button>
  </div>

  <div class="chat-area">
    <div class="chat-title">💬 Chat</div>
    <div class="chat-msgs" id="web-chat-msgs"></div>
    <div class="chat-row">
      <input type="text" id="web-chat-input" placeholder="Type a message…">
      <button class="send-btn" id="web-send-msg">Send</button>
    </div>
  </div>

  <div class="files-area">
    <div class="files-header">
      <span>📁 Files & Images</span>
    </div>
    <div class="files-list" id="web-files-list">
      <div style="color:var(--text3);font-size:12px;padding:8px 0;text-align:center">No files yet</div>
    </div>
    <label class="send-file-btn" for="file-input-web">
      📎 Click to send a file or image
    </label>
    <input type="file" id="file-input-web" multiple>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── Inline copy of webrtc.js logic (self-contained for this page) ── */
const SIGNAL_SERVER = 'wss://signalling-server-production-c815.up.railway.app';
const ICE_SERVERS = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
]};
const MAX_CHUNK = 16384;

class PeerLink {
  constructor(cb) {
    this.cb = cb; this.ws = null; this.pc = null;
    this.localStream = null; this.screenStream = null;
    this.roomId = null; this.isHost = false;
    this.chatChannel = null; this.fileChannel = null;
    this.fileRecvBuf = []; this.fileRecvMeta = null;
  }
  genId() {
    const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('');
  }
  async joinRoom(id) {
    this.roomId = id.toUpperCase().trim();
    this.isHost = false;
    await this.connectWS();
    this.ws.send(JSON.stringify({ type:'join', room:this.roomId }));
  }
  connectWS() {
    return new Promise((res,rej) => {
      this.ws = new WebSocket(SIGNAL_SERVER);
      this.ws.onopen = () => { this.cb.onConnected?.(); res(); };
      this.ws.onerror = e => { this.cb.onError?.('Server unreachable'); rej(e); };
      this.ws.onclose = () => this.cb.onDisconnected?.();
      this.ws.onmessage = async e => {
        let m; try { m = JSON.parse(e.data); } catch { return; }
        await this.handle(m);
      };
    });
  }
  async handle(m) {
    switch(m.type) {
      case 'room-joined': this.cb.onJoined?.(); break;
      case 'offer': await this.handleOffer(m.sdp); break;
      case 'answer': await this.pc?.setRemoteDescription(new RTCSessionDescription({type:'answer',sdp:m.sdp})); break;
      case 'ice-candidate': try { await this.pc?.addIceCandidate(new RTCIceCandidate(m.candidate)); } catch {} break;
      case 'peer-left': this.cb.onPeerLeft?.(); break;
      case 'error': this.cb.onError?.(m.message||'Error'); break;
    }
  }
  send(o) { if(this.ws?.readyState===1) this.ws.send(JSON.stringify({...o,room:this.roomId})); }
  async handleOffer(sdp) {
    await this.setupPC();
    if(this.localStream) this.localStream.getTracks().forEach(t=>this.pc.addTrack(t,this.localStream));
    await this.pc.setRemoteDescription(new RTCSessionDescription({type:'offer',sdp}));
    const a = await this.pc.createAnswer();
    await this.pc.setLocalDescription(a);
    this.send({type:'answer',sdp:a.sdp});
  }
  async setupPC() {
    if(this.pc) this.pc.close();
    this.pc = new RTCPeerConnection(ICE_SERVERS);
    this.pc.onicecandidate = ({candidate}) => { if(candidate) this.send({type:'ice-candidate',candidate}); };
    this.pc.ontrack = e => this.cb.onRemoteStream?.(e.streams[0]);
    this.pc.onconnectionstatechange = () => this.cb.onState?.(this.pc.connectionState);
    this.pc.ondatachannel = e => this.attachCh(e.channel);
  }
  attachCh(ch) {
    if(ch.label==='chat') { this.chatChannel=ch; ch.onmessage=e=>{ try{const m=JSON.parse(e.data); this.handleChatMsg(m);}catch{} }; }
    if(ch.label==='file') { this.fileChannel=ch; ch.binaryType='arraybuffer'; ch.onmessage=e=>this.handleFileBin(e.data); }
  }
  handleChatMsg(m) {
    if(m.type==='file-meta') { this.fileRecvMeta=m; this.fileRecvBuf=[]; this.cb.onFileStart?.(m); }
    else if(m.type==='file-end') { this.finishFile(); }
    else if(m.type==='text') this.cb.onChat?.(m);
  }
  handleFileBin(data) {
    if(!this.fileRecvMeta) return;
    this.fileRecvBuf.push(data);
    const got=this.fileRecvBuf.reduce((a,b)=>a+b.byteLength,0);
    this.cb.onFileProgress?.(got/this.fileRecvMeta.size);
  }
  finishFile() {
    if(!this.fileRecvMeta) return;
    const blob=new Blob(this.fileRecvBuf,{type:this.fileRecvMeta.mime||'application/octet-stream'});
    this.cb.onFileComplete?.({...this.fileRecvMeta,url:URL.createObjectURL(blob)});
    this.fileRecvMeta=null; this.fileRecvBuf=[];
  }
  sendChat(text) {
    const m={type:'text',text,time:Date.now()};
    if(this.chatChannel?.readyState==='open') this.chatChannel.send(JSON.stringify(m));
    return m;
  }
  async sendFile(file) {
    if(!this.fileChannel||this.fileChannel.readyState!=='open') { this.cb.onError?.('Not connected yet'); return; }
    const meta={type:'file-meta',name:file.name,size:file.size,mime:file.type};
    this.chatChannel.send(JSON.stringify(meta));
    this.cb.onFileSendStart?.(file);
    const buf = await file.arrayBuffer();
    const total = Math.ceil(buf.byteLength/MAX_CHUNK);
    let sent=0;
    for(let i=0;i<total;i++){
      const chunk=buf.slice(i*MAX_CHUNK,(i+1)*MAX_CHUNK);
      while(this.fileChannel.bufferedAmount>1024*1024) await new Promise(r=>setTimeout(r,50));
      this.fileChannel.send(chunk);
      sent+=chunk.byteLength;
      this.cb.onFileSendProgress?.(sent/buf.byteLength);
    }
    this.chatChannel.send(JSON.stringify({type:'file-end',name:file.name}));
    this.cb.onFileSendDone?.(file);
  }
  async getMedia() {
    try { this.localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); return this.localStream; }
    catch(e) { this.cb.onError?.('Camera/mic denied'); throw e; }
  }
  async startScreen() {
    this.screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    const t=this.screenStream.getVideoTracks()[0];
    const s=this.pc?.getSenders().find(x=>x.track?.kind==='video');
    if(s) await s.replaceTrack(t);
    t.onended=()=>this.stopScreen();
    this.cb.onScreenStart?.();
    return this.screenStream;
  }
  async stopScreen() {
    this.screenStream?.getTracks().forEach(t=>t.stop()); this.screenStream=null;
    const cam=this.localStream?.getVideoTracks()[0];
    const s=this.pc?.getSenders().find(x=>x.track?.kind==='video');
    if(s&&cam) await s.replaceTrack(cam);
    this.cb.onScreenStop?.();
  }
  toggleMute() { const t=this.localStream?.getAudioTracks(); if(!t?.length) return; t[0].enabled=!t[0].enabled; return t[0].enabled; }
  toggleVideo() { const t=this.localStream?.getVideoTracks(); if(!t?.length) return; t[0].enabled=!t[0].enabled; return t[0].enabled; }
  hangUp() {
    this.send({type:'leave'});
    this.localStream?.getTracks().forEach(t=>t.stop());
    this.screenStream?.getTracks().forEach(t=>t.stop());
    this.chatChannel?.close(); this.fileChannel?.close();
    this.pc?.close(); this.ws?.close();
    this.pc=null; this.ws=null; this.localStream=null; this.screenStream=null;
  }
}

/* ── UI ── */
let peer = null;
let isMuted=false, isCamOff=false, isScreen=false;

const $ = id => document.getElementById(id);
let toastT;
function toast(m,d=2800){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),d);}
function fmtSz(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB';}
function fmtT(ts){const d=new Date(ts);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fileIco(n){const e=n.split('.').pop().toLowerCase();if(['jpg','jpeg','png','gif','webp','svg'].includes(e))return '🖼️';if(['mp4','mov','avi','mkv'].includes(e))return '🎬';if(['mp3','wav','ogg'].includes(e))return '🎵';if(e==='pdf')return '📄';if(['zip','rar','7z'].includes(e))return '🗜️';return '📁';}

function appendChat(text,side,time){const l=$('web-chat-msgs');const d=document.createElement('div');d.className='msg '+side;d.innerHTML='<div>'+esc(text)+'</div><div style="font-size:10px;opacity:0.6;margin-top:2px">'+fmtT(time||Date.now())+'</div>';l.appendChild(d);l.scrollTop=l.scrollHeight;}
function sysMsg(t){const l=$('web-chat-msgs');const d=document.createElement('div');d.className='msg system';d.textContent=t;l.appendChild(d);l.scrollTop=l.scrollHeight;}

function addFileUI(name,size,dir){
  const l=$('web-files-list');
  const old=l.querySelector('div');
  if(old&&old.textContent.includes('No files'))l.innerHTML='';
  const el=document.createElement('div');
  el.className='file-item'; el.dataset.dir=dir;
  el.innerHTML=`<div class="file-icon">${fileIco(name)}</div><div class="file-info"><div class="file-name">${esc(name)}</div><div class="file-meta">${fmtSz(size)} · ${dir==='send'?'⬆️ Sending':'⬇️ Receiving'}</div><div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div></div>`;
  l.appendChild(el);
}
function updProg(dir,r){const items=$('web-files-list').querySelectorAll('.file-item[data-dir="'+dir+'"]');const last=items[items.length-1];if(last)last.querySelector('.progress-fill').style.width=(r*100)+'%';}
function finFile(dir,name,url){const items=$('web-files-list').querySelectorAll('.file-item[data-dir="'+dir+'"]');const last=items[items.length-1];if(!last)return;last.querySelector('.progress-fill').style.width='100%';last.querySelector('.file-meta').innerHTML=dir==='send'?'✅ Sent':'✅ Received · <a href="'+url+'" download="'+name+'" style="color:#4f8ef7;text-decoration:none">Download ↓</a>';last.querySelector('.progress-bar').style.display='none';}

function setWebStatus(dotClass, text){$('web-dot').className='dot '+dotClass;$('web-status-text').textContent=text;}

// Read room code from URL ?room=XXX
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  if (room) $('room-code-input').value = room.toUpperCase();
  $('room-code-input').addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase();
  });
});

$('btn-join').addEventListener('click', async () => {
  const code = $('room-code-input').value.trim().toUpperCase();
  if (code.length < 4) { toast('Please enter a valid room code'); return; }

  $('btn-join').disabled = true;
  $('btn-join').textContent = '⏳ Connecting…';

  peer = new PeerLink({
    onConnected() { setStatus('amber','Joining room…'); },
    onJoined() { },
    onRemoteStream(stream) {
      $('video-remote').srcObject = stream;
      setWebStatus('green','Connected');
      sysMsg('✅ Connected!');
      toast('🟢 Connected!');
    },
    onState(s) {
      if(s==='connected'){setWebStatus('green','In call');}
      else if(s==='disconnected'||s==='failed'){setWebStatus('amber','Reconnecting…');toast('⚠️ Connection issue');}
    },
    onChat(m) { appendChat(m.text,'theirs',m.time); },
    onFileStart(meta) { addFileUI(meta.name,meta.size,'recv'); toast('📥 Receiving: '+meta.name); },
    onFileProgress(r) { updProg('recv',r); },
    onFileComplete(info) { finFile('recv',info.name,info.url); toast('✅ Received: '+info.name); },
    onFileSendStart(f) { addFileUI(f.name,f.size,'send'); },
    onFileSendProgress(r) { updProg('send',r); },
    onFileSendDone(f) { finFile('send',f.name,null); toast('✅ Sent: '+f.name); },
    onScreenStart() { isScreen=true; $('web-screen').classList.add('active'); $('web-screen').textContent='🛑'; toast('Screen sharing'); },
    onScreenStop() { isScreen=false; $('web-screen').classList.remove('active'); $('web-screen').textContent='🖥️'; toast('Screen share stopped'); },
    onPeerLeft() { sysMsg('⚠️ They left the call.'); setWebStatus('','Call ended'); toast('Other person left'); },
    onDisconnected() { setWebStatus('','Disconnected'); },
    onError(m) { toast('❌ '+m,4000); },
  });

  function setStatus(c,t){$('status-dot').className='dot '+c;$('status-text').textContent=t;}

  try {
    const stream = await peer.getMedia();
    $('video-local').srcObject = stream;
    await peer.joinRoom(code);

    // Show call UI
    $('join-ui').style.display = 'none';
    const cui = $('call-ui');
    cui.style.display = 'flex';
    cui.style.flexDirection = 'column';
    cui.style.gap = '12px';
    cui.style.padding = '16px';
    setWebStatus('amber','Waiting for host to answer…');
    sysMsg('Joined room. Waiting for the call to start…');
  } catch(e) {
    toast('❌ Could not join. Check the code.', 4000);
    $('btn-join').disabled = false;
    $('btn-join').textContent = '🎥 Join Call';
  }
});

$('web-mute').addEventListener('click',()=>{if(!peer)return;const on=peer.toggleMute();isMuted=!on;$('web-mute').textContent=isMuted?'🔇':'🎤';$('web-mute').classList.toggle('active',isMuted);toast(isMuted?'🔇 Muted':'🎤 Unmuted');});
$('web-video').addEventListener('click',()=>{if(!peer)return;const on=peer.toggleVideo();isCamOff=!on;$('web-video').textContent=isCamOff?'📷':'📹';$('web-video').classList.toggle('active',isCamOff);toast(isCamOff?'📷 Camera off':'📹 Camera on');});
$('web-screen').addEventListener('click',async()=>{if(!peer)return;if(isScreen){await peer.stopScreen();}else{try{await peer.startScreen();}catch(e){if(e.name!=='NotAllowedError')toast('❌ Screen share failed');}}});
$('web-hangup').addEventListener('click',()=>{peer?.hangUp();peer=null;$('call-ui').style.display='none';$('join-ui').style.display='flex';toast('Call ended');});

$('web-send-msg').addEventListener('click',sendChat);
$('web-chat-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
function sendChat(){const t=$('web-chat-input').value.trim();if(!t||!peer)return;const m=peer.sendChat(t);if(m)appendChat(t,'mine',m.time);$('web-chat-input').value='';}

$('file-input-web').addEventListener('change',async e=>{const files=Array.from(e.target.files);for(const f of files)await peer?.sendFile(f);e.target.value='';});
</script>
</body>
</html>
